<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тимур — игры и сайты</title>
<meta name="description" content="Все мои игры, сайты и программы на одной странице.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --card-shadow: 0 1px 2px rgba(0,0,0,.06), 0 6px 20px rgba(0,0,0,.06);
    --card-shadow-hover: 0 4px 10px rgba(0,0,0,.08), 0 18px 40px rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111114;
      --text: #f5f5f7;
      --muted: #9a9aa2;
      --card-shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
      --card-shadow-hover: 0 4px 10px rgba(0,0,0,.5), 0 18px 40px rgba(0,0,0,.55);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    text-align: center;
    padding: 64px 16px 36px;
  }
  .logo {
    display: inline-block;
    font-size: clamp(44px, 9vw, 84px);
    font-weight: 900;
    letter-spacing: -0.03em;
    margin: 0;
    line-height: 1;
  }
  .logo span { display: inline-block; transition: transform .25s cubic-bezier(.3,1.6,.6,1); }
  .logo:hover span:nth-child(odd) { transform: translateY(-6px) rotate(-4deg); }
  .logo:hover span:nth-child(even) { transform: translateY(4px) rotate(3deg); }
  .tagline {
    margin: 14px 0 0;
    color: var(--muted);
    font-size: 19px;
    font-weight: 600;
  }
  main {
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 16px 40px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 28px 24px;
  }
  .card {
    display: block;
    color: inherit;
    text-decoration: none;
    opacity: 0;
    transform: translateY(14px);
    animation: rise .5s ease forwards;
  }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .thumb {
    position: relative;
    aspect-ratio: 4 / 3;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: var(--card-shadow);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .thumb svg { display: block; width: 100%; height: 100%; }
  .card:hover .thumb, .card:focus-visible .thumb {
    transform: translateY(-5px) scale(1.02);
    box-shadow: var(--card-shadow-hover);
  }
  .card:focus-visible { outline: none; }
  .card:focus-visible .thumb { outline: 3px solid #4f7cff; outline-offset: 3px; }
  .badge {
    position: absolute;
    top: 10px; right: 10px;
    background: rgba(0,0,0,.55);
    color: #fff;
    font-size: 12px;
    font-weight: 800;
    padding: 4px 9px;
    border-radius: 999px;
    backdrop-filter: blur(4px);
  }
  .title {
    margin: 14px 4px 2px;
    font-size: 20px;
    font-weight: 800;
    line-height: 1.2;
  }
  .desc {
    margin: 0 4px;
    color: var(--muted);
    font-size: 15px;
    font-weight: 600;
    line-height: 1.35;
  }
  /* small animations inside thumbnails */
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 14s linear infinite; }
  .bob { animation: bob 3s ease-in-out infinite; }
  .twinkle { animation: twinkle 2.4s ease-in-out infinite; }
  .fly { animation: fly 2.6s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  @keyframes twinkle { 50% { opacity: .25; } }
  .draw { stroke-dasharray: 600; animation: draw 3s ease-in-out infinite; }
  @keyframes draw { 0% { stroke-dashoffset: 600; } 60%, 100% { stroke-dashoffset: 0; } }
  @keyframes fly { 50% { transform: translateY(-10px); } }
  @media (prefers-reduced-motion: reduce) {
    .spin, .bob, .twinkle, .fly, .draw, .card { animation: none; opacity: 1; transform: none; }
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
    padding: 20px 16px 48px;
  }
  footer a { color: inherit; }
  @media (max-width: 560px) {
    header { padding-top: 44px; }
    .grid { grid-template-columns: 1fr 1fr; gap: 22px 14px; }
    .title { font-size: 16px; margin-top: 10px; }
    .desc { font-size: 13px; }
    .badge { font-size: 10px; padding: 3px 7px; }
  }
</style>
</head>
<body>
<header>
  <h1 class="logo" aria-label="tymur.fun"><span>t</span><span>y</span><span>m</span><span>u</span><span>r</span><span>.</span><span>f</span><span>u</span><span>n</span></h1>
  <p class="tagline">Игры, сайты и всякие штуки, которые я сделал</p>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>
  Код всех проектов — на <a href="https://github.com/tymurius2-arch">GitHub</a>
</footer>

    <g class="spin"><circle cx="270" cy="140" r="78" fill="#7cff4f" opacity=".25"/>

    <g class="fly"><ellipse cx="120" cy="180" rx="70" ry="18" fill="#9aa3b5"/><ellipse cx="120" cy="170" rx="34" ry="22" fill="#aee7ff" opacity=".85"/>
      <circle cx="70" cy="184" r="4" fill="#ffe14d"/><circle cx="95" cy="190" r="4" fill="#ffe14d"/><circle cx="145" cy="190" r="4" fill="#ffe14d"/><circle cx="170" cy="184" r="4" fill="#ffe14d"/></g>`,

const projects = [
  { id: "perfect-circle", title: "Нарисуй идеальный круг", desc: "Насколько ровно ты рисуешь?" },
  { id: "city-rng",       title: "Город удачи",     desc: "Открывай кейсы и собирай редкие здания" },
  { id: "aquarium",       title: "Эволюция",        desc: "От первой клетки до человека — и ещё 160 существ" },
  { id: "rocket-builder", title: "Ракетостроитель", desc: "Собери 3D-ракету и улети на орбиту" },
  { id: "rick-morty",     title: "Рик и Морти",     desc: "Аркада: побег через порталы" },
  { id: "frontline",      title: "Линия фронта",    desc: "Стратегия на настоящей карте" },
  { id: "price-guess",    title: "Угадай цену",     desc: "Назови цену товара быстрее ИИ" },
];

function rand(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function stars(n, color, maxY = 300) {
  const r = rand(n * 97 + maxY);
  let out = "";
  for (let i = 0; i < n; i++) {
    const cls = i % 4 === 0 ? ' class="twinkle"' : "";
    out += `<circle${cls} cx="${(r() * 400).toFixed(1)}" cy="${(r() * maxY).toFixed(1)}" r="${(r() * 1.6 + .5).toFixed(1)}" fill="${color}" style="animation-delay:${(r() * 2).toFixed(2)}s"/>`;
  }
  return out;
}

const grid = document.getElementById("grid");
projects.forEach((p, i) => {
  const a = document.createElement("a");
  a.className = "card";
  a.href = p.href || BASE + p.id + "/";
  a.style.animationDelay = (i * 0.05) + "s";
  a.innerHTML = `
    <div class="thumb">
      <svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${art[p.id]}</svg>
      ${p.badge ? `<span class="badge">${p.badge}</span>` : ""}
    </div>
    <h2 class="title">${p.title}</h2>
    <p class="desc">${p.desc}</p>`;
  grid.appendChild(a);
});
</script>
</body>
</html>
